<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1420;--panel:#171e2e;--panel2:#1f2840;--line:#2c3754;--ink:#e9edf6;--muted:#93a0bd;--acc:#ffcb3d;--acc2:#e3463c;--hp-g:#3fd27a;--hp-y:#f2c33a;--hp-r:#ec4b3c;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Rubik,system-ui,sans-serif}
body{background:radial-gradient(1200px 600px at 50% -200px,#24304d 0%,transparent 70%),var(--bg);min-height:100vh}
#app{max-width:1080px;margin:0 auto;padding:12px 16px 120px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
.primary{background:var(--acc);color:#1b1404;font-weight:700;padding:12px 22px;border-radius:999px;box-shadow:0 4px 0 #b88b12;transition:transform .08s}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #b88b12}.primary:disabled{background:#3a4560;color:#8d97b0;box-shadow:none}
.ghost{border:1px solid var(--line);padding:6px 12px;border-radius:999px;color:var(--muted)}.ghost:hover{color:var(--ink);border-color:#4a5a85}
.muted{color:var(--muted)}.mono{font-family:"Press Start 2P",monospace;font-size:12px;color:var(--acc)}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.brand{display:flex;align-items:baseline;gap:10px}.logo{font-family:"Press Start 2P",monospace;font-size:16px;color:var(--acc);text-shadow:3px 3px 0 #9b3a1d}
.daynum{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--muted)}.hstats{display:flex;gap:12px;align-items:center}
.type{display:inline-block;background:var(--c);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:4px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.spr{image-rendering:pixelated;width:96px;height:96px}.spr.flip{transform:scaleX(-1)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* leader */
.leader{display:flex;gap:20px;align-items:center;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.leader h1{margin:2px 0 6px;font-size:26px}.tspr{image-rendering:pixelated;width:160px;height:auto}
.trainer{flex:0 0 auto;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,#2c3a5e,transparent 70%);border-radius:12px}
.lteam{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.lmon{background:rgba(0,0,0,.2);border-radius:10px;padding:4px 8px 8px;text-align:center;min-width:96px}
.lmon .spr{width:72px;height:72px}.lname{font-weight:500;font-size:13px}.lvl{font-size:12px;color:var(--muted);margin-bottom:3px}
.leader.compact{padding:10px 14px}.leader.compact .tspr{width:80px}.leader.compact h1{font-size:19px}.leader.compact .lteam{margin-top:6px}
.leader.compact .lmon{min-width:0;padding:2px 6px 4px}.leader.compact .lmon .spr{width:48px;height:48px}.leader.compact .lmon .lname,.leader.compact .lmon>div:last-child{display:none}
.cta{text-align:center;padding:28px 10px}.cta p{max-width:560px;margin:0 auto 18px;color:var(--muted)}
/* draft */
.drafthead{display:flex;align-items:baseline;gap:14px;margin:22px 0 10px;flex-wrap:wrap}.drafthead h2{margin:0;font-family:"Press Start 2P",monospace;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{position:relative;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:12px;transition:border-color .15s,transform .15s}
.card:hover{border-color:#4a5a85;transform:translateY(-2px)}.card.picked{border-color:var(--acc);background:linear-gradient(180deg,#2a2a1a,var(--panel) 40%)}
.badge{position:absolute;top:10px;right:10px;background:var(--acc);color:#1b1404;font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px}
.chead{display:flex;align-items:center;gap:6px}.chead .spr{width:72px;height:72px;margin:-6px 0 -6px -8px}.cname{font-weight:700;font-size:17px}
.kv{display:flex;align-items:center;width:100%;text-align:left;font-size:13px;margin-top:4px;padding:2px 4px;border-radius:6px}.kv:hover{background:rgba(255,255,255,.06)}.kv b{color:var(--muted);font-weight:500;margin-right:4px}
.idot{margin-left:auto;width:15px;height:15px;flex:0 0 15px;border-radius:50%;border:1px solid currentColor;font:italic 700 10px/13px Georgia,serif;text-align:center;opacity:.55}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}.card{cursor:pointer}
.moves{list-style:none;margin:8px 0;padding:0;display:grid;gap:4px}
.moves li{list-style:none}.mv{width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--c) 22%,transparent);border-left:4px solid var(--c);padding:4px 8px;border-radius:6px;font-size:13px}
.mv:hover{filter:brightness(1.2)}.mv .idot{margin-left:2px}.mname{flex:1}.mcat{font-size:10px;font-weight:700;width:16px;height:16px;display:grid;place-items:center;border-radius:4px}
.mcat.physical{background:#c8462e}.mcat.special{background:#3d6ad6}.mcat.status{background:#777}.mbp{width:28px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{display:grid;gap:2px;margin-top:6px}.stat{display:grid;grid-template-columns:30px 1fr 28px;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.stat i{display:block;height:6px;border-radius:3px;background:var(--c)}.stat em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:14px;display:flex;justify-content:center;background:linear-gradient(transparent,var(--bg) 40%);pointer-events:none}.sticky button{pointer-events:auto}
/* battle */
.battle{display:grid;gap:12px}
.field{position:relative;height:360px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#222;isolation:isolate}
.psbg{position:absolute;inset:0;z-index:1;pointer-events:none}.psbg .background{position:absolute;inset:0;background-size:cover!important}
.psfx{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}.psfx>*{position:absolute}
.turnstatus-protect{border-radius:50%;background:radial-gradient(circle,rgba(160,220,255,.15) 40%,rgba(120,200,255,.55) 70%,transparent 72%)}
.sidecondition-reflect,.sidecondition-lightscreen,.sidecondition-auroraveil,.sidecondition-safeguard,.sidecondition-mist{border-radius:8px;border:2px solid rgba(255,255,255,.7)}
.sidecondition-reflect{background:rgba(255,110,90,.35)}.sidecondition-lightscreen{background:rgba(255,230,90,.35)}.sidecondition-auroraveil{background:linear-gradient(90deg,rgba(130,220,255,.35),rgba(220,140,255,.35))}
.sidecondition-safeguard{background:rgba(160,255,160,.35)}.sidecondition-mist{background:rgba(230,240,255,.45);border-color:transparent;filter:blur(2px)}
.hstats .anims[aria-pressed=false]{opacity:.6}
.arena,.arena-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.arena .flame{animation:flick 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}.arena .spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes flick{to{transform:scaleY(.8) scaleX(1.12)}}@keyframes spin{to{transform:rotate(360deg)}}
.arenaname{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.4);padding:2px 10px;border-radius:999px;white-space:nowrap;pointer-events:none;z-index:3}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}.fx i{position:absolute;display:block;animation:fall linear infinite;transform:scale(var(--s))}
.fx-snow i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.85}
.fx-embers i{width:4px;height:4px;border-radius:50%;background:#ffb347;box-shadow:0 0 6px #ff7a1a;animation-name:rise}
.fx-sparks i{width:3px;height:10px;background:#fff59a;box-shadow:0 0 6px #ffe14d;animation-name:blink}
.fx-bubbles i{width:9px;height:9px;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation-name:rise}
.fx-leaves i{width:10px;height:6px;border-radius:0 8px;background:#7bc043;animation-name:drift}
.fx-petals i{width:8px;height:6px;border-radius:6px 0;background:#ffb3d1;animation-name:drift}
.fx-feathers i{width:12px;height:4px;border-radius:50%;background:#fff;opacity:.85;animation-name:drift}
.fx-wisps i{width:14px;height:14px;border-radius:50%;background:radial-gradient(#d8b8ff,transparent 70%);animation-name:float}
.fx-dust i{width:3px;height:3px;border-radius:50%;background:rgba(255,240,210,.55);animation-name:float}
.fx-twinkle i{width:4px;height:4px;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff;animation-name:blink}
.fx-rain i{width:1.5px;height:16px;background:rgba(255,255,255,.5)}
@keyframes fall{from{transform:translateY(-380px) scale(var(--s))}to{transform:translateY(380px) scale(var(--s))}}
@keyframes rise{from{transform:translateY(200px) scale(var(--s));opacity:0}20%{opacity:1}to{transform:translateY(-300px) scale(var(--s));opacity:0}}
@keyframes drift{from{transform:translate(-60px,-380px) rotate(0) scale(var(--s))}to{transform:translate(80px,380px) rotate(540deg) scale(var(--s))}}
@keyframes float{0%,100%{transform:translate(0,0) scale(var(--s));opacity:.2}50%{transform:translate(20px,-24px) scale(var(--s));opacity:.9}}
@keyframes blink{0%,100%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.fx,.arena .flame,.arena .spin{animation:none!important}.fx{display:none}}
.weather{position:absolute;inset:0;pointer-events:none;transition:background .6s}
.weather.raindance{background:linear-gradient(180deg,rgba(40,70,120,.45),rgba(40,70,120,.25)),repeating-linear-gradient(105deg,transparent 0 14px,rgba(255,255,255,.25) 14px 15px)}
.weather.sunnyday{background:radial-gradient(circle at 85% 0%,rgba(255,220,120,.7),transparent 60%)}
.weather.sandstorm{background:rgba(196,160,90,.45)}.weather.hail{background:rgba(220,240,255,.45)}
.plat{position:absolute;width:220px;height:46px;border-radius:50%;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--plat,#5e9e48) 100%,#fff 12%) 0%,var(--plat,#5e9e48) 60%,color-mix(in srgb,var(--plat,#5e9e48) 75%,#000) 100%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 8px 18px rgba(0,0,0,.25)}
.plat,.mon{z-index:1}.hpbox,.balls,.fieldtrainer{z-index:4}
.foe .plat{right:60px;top:150px}.me .plat{left:40px;bottom:16px;width:260px;height:54px}
.mon{position:absolute}.mon .spr{width:150px;height:150px}.mon.p2{right:96px;top:46px}.mon.p1{left:56px;bottom:22px}.mon.p1 .spr{width:190px;height:190px}
.mon.enter{animation:enter .45s ease-out}.mon.hit .spr{animation:hit .45s}.mon.lunge.p1{animation:lungeR .35s}.mon.lunge.p2{animation:lungeL .35s}.mon.faint{animation:faint .7s forwards}
@keyframes enter{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes hit{0%,40%,80%{opacity:.2}20%,60%,100%{opacity:1}}
@keyframes lungeR{50%{transform:translate(26px,-10px)}}@keyframes lungeL{50%{transform:translate(-26px,10px)}}
@keyframes faint{to{transform:translateY(60px);opacity:0}}
.fieldtrainer{position:absolute;right:8px;top:6px;width:64px;image-rendering:pixelated;opacity:.85}
.hpbox{position:absolute;background:#f8f6ec;color:#222;border-radius:10px;padding:7px 12px 6px;min-width:230px;box-shadow:0 3px 0 #b9b19a,0 6px 18px rgba(0,0,0,.25)}
.hpbox.p2{left:16px;top:22px}.hpbox.p1{right:16px;bottom:30px}
.hpname{display:flex;gap:8px;align-items:center;font-weight:700}.hpname .n{flex:1}.lv{font-size:12px;color:#555}
.bar{height:8px;background:#3a3a3a;border-radius:4px;margin-top:5px;overflow:hidden;border:2px solid #3a3a3a}.bar i{display:block;height:100%;width:100%;transition:width .6s ease,background .6s}
.hpnum{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:#444;margin-top:2px;min-height:16px}
.st{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;color:#fff}.st:empty{display:none}
.st.brn{background:#e07a2a}.st.par{background:#c9a300}.st.slp{background:#8a8a8a}.st.frz{background:#58a8c8}.st.psn,.st.tox{background:#9b3fa0}
.balls{position:absolute;display:flex;gap:4px}.balls.p2{left:20px;top:96px}.balls.p1{right:22px;bottom:8px}
.ball{width:13px;height:13px;border-radius:50%;background:linear-gradient(#e3463c 0 45%,#222 45% 55%,#fff 55%);border:1px solid #222}.ball.out{filter:grayscale(1);opacity:.45}.ball.sts{box-shadow:0 0 0 2px #c9a300}
.console{display:grid;grid-template-columns:1fr 1.25fr;gap:12px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;height:250px;overflow:auto;font-size:14px}
.ln{padding:1px 0}.ln.dim{color:var(--muted)}.ln.se{color:#ffb547;font-weight:500}.ln.faint{color:#ff7a6b;font-weight:500}.ln.turn{color:#6c7aa0;font-size:12px;margin-top:6px;text-align:center}
.ln.move.p1{color:#9fd3ff}.ln.move.p2{color:#ffc1b8}.ln.ability{color:#d0b3ff;font-size:13px}.ln.win{color:var(--acc);font-weight:700}.ln.sys{color:#6c7aa0;font-style:italic}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:10px;align-content:start}
.movegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.movecell{position:relative;display:grid}.movebtn{text-align:left;padding-right:34px!important;padding:9px 12px;border-radius:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 85%,#fff 15%),var(--c));color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000);text-shadow:0 1px 1px rgba(0,0,0,.35);display:grid}
.movebtn:hover:not(:disabled){filter:brightness(1.08)}.movebtn:disabled{filter:grayscale(.8) brightness(.6)}
.mvn{font-weight:700;font-size:15px}.mvm{font-size:11.5px;opacity:.92}.eff{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.eff.good{color:#fff6b0}.eff.bad{color:#e2e2e2;opacity:.85}
.party{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pmon{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:0 4px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 8px 6px 2px;font-size:13px;text-align:left;position:relative}
.pmon .spr{width:44px;height:44px;grid-row:span 2}.pmon:hover:not(:disabled){border-color:var(--acc)}.pmon:disabled{opacity:.45}
.mini{display:block;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--hp-g) var(--w),#3a4560 var(--w))}.pmon em{position:absolute;top:4px;right:6px;font-style:normal}
.meinfo{font-size:13px;color:var(--muted);padding:0 2px}.meinfo b{color:var(--ink)}
.ibtn{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.28);color:#fff;font:italic 700 13px/24px Georgia,serif;text-align:center}.ibtn:hover{background:rgba(0,0,0,.45)}
.link{color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px}.link:hover{color:var(--acc)}
.info{position:fixed;z-index:20;width:320px;max-width:calc(100vw - 16px);background:#1d2539;border:1px solid #3a4870;border-radius:12px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:pop .12s ease-out}
.info h4{margin:0 26px 6px 0;font-size:17px}.itags{display:flex;gap:6px;align-items:center;margin-bottom:10px}.cat{background:var(--c);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.istat{background:rgba(255,255,255,.05);border-radius:8px;padding:5px 6px;text-align:center}.istat span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.istat b{font-size:15px}
.info .more{margin-top:8px;font-size:13px;color:var(--acc);text-decoration:underline dotted;text-underline-offset:3px}.info .full{margin-top:8px!important;font-size:13px!important;color:var(--muted)!important;max-height:40vh;overflow:auto}
.info p{margin:0;color:#cfd6e6;font-size:14px;line-height:1.5}.ix{position:absolute;top:6px;right:8px;font-size:22px;color:var(--muted);width:28px;height:28px}.ix:hover{color:var(--ink)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.mon .spr.sub{image-rendering:auto}
.prompt{color:var(--muted);text-align:center;padding:4px}
/* results */
.result{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:14px;text-align:center}
.result h2{font-family:"Press Start 2P",monospace;font-size:15px;line-height:1.6;color:var(--acc)}.result.lost h2{color:#ff8b7d}
.rteams{display:flex;justify-content:center;gap:36px;flex-wrap:wrap;margin:6px 0 14px}.row{display:flex;gap:2px}.rm .spr{width:64px;height:64px}.rm.f{filter:grayscale(1);opacity:.4}
.share{display:inline-block;text-align:left;background:#0b0f18;border:1px solid var(--line);border-radius:10px;padding:12px 16px;font:14px/1.5 ui-monospace,Menlo,monospace;margin:0 0 12px;user-select:all;white-space:pre}
.statrow{display:flex;justify-content:center;gap:28px;margin:18px 0 6px}.statrow div{display:grid;font-size:12px;color:var(--muted)}.statrow b{font-size:24px;color:var(--ink)}
/* dialog */
.modal{position:fixed;inset:0;background:rgba(5,8,15,.7);display:grid;place-items:center;padding:16px;z-index:10}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;max-width:540px;width:100%}
.dialog h3{margin:0 0 8px;font-family:"Press Start 2P",monospace;font-size:13px;color:var(--acc)}.dialog li{margin-bottom:8px;color:#c9d1e4}.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
@media (max-width:760px){
  .hstats .anims .lbl{display:none}
  .info{left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto;max-width:none;border-radius:16px}
  .leader{flex-direction:column;text-align:center}.leader .lteam{justify-content:center}.leader.compact{flex-direction:row;text-align:left}
  .console{grid-template-columns:1fr}.log{height:150px;order:2}.field{height:290px}
  .mon.p2{right:30px;top:42px}.mon .spr{width:112px;height:112px}.mon.p1 .spr{width:140px;height:140px}.mon.p1{left:10px;bottom:16px}
.foe .plat{right:10px;top:120px;width:170px}.me .plat{left:4px;width:200px}
  .hpbox{min-width:170px;padding:6px 9px 5px;font-size:13px}.hpbox.p2{left:8px;top:12px}.hpbox.p1{right:8px;bottom:26px}.balls.p2{left:12px;top:80px}
  .fieldtrainer{display:none}.party{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app"></div>
<script>/*APP*/</script>
</body>
</html>
